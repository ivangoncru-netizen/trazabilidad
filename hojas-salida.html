            );
        }

        function BranchManagement({ branches }) {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingBranch, setEditingBranch] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({
                name: '',
                code: '',
                type: 'Normal',
                isActive: true
            });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                
                try {
                    const code = (formData.code || '').trim();
                    if (!formData.name || !code) {
                        alert('Nombre y Código son obligatorios');
                        setIsLoading(false);
                        return;
                    }
                    const dupSnap = await db.collection('branches').where('code', '==', code).get();
                    const hasDuplicate = dupSnap.docs.some(d => !editingBranch || d.id !== editingBranch.id);
                    if (hasDuplicate) {
                        alert('El código de sucursal ya existe. Use un código único.');
                        setIsLoading(false);
                        return;
                    }

                    if (editingBranch) {
                        await db.collection('branches').doc(editingBranch.id).update({
                            ...formData,
                            code
                        });
                    } else {
                        await db.collection('branches').add({
                            ...formData,
                            code,
                            createdAt: Timestamp.now()
                        });
                    }
                    handleCloseModal();
                } catch (error) {
                    console.error('Error al guardar sucursal:', error);
                    alert('Error al guardar la sucursal');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleEdit = (branch) => {
                setEditingBranch(branch);
                setFormData({
                    name: branch.name || '',
                    code: branch.code || '',
                    type: branch.type || 'Normal',
                    isActive: branch.isActive !== false
                });
                setIsModalOpen(true);
            };

            const handleDelete = async (branchId) => {
                if (!confirm('¿Está seguro de eliminar esta sucursal?')) return;
                
                try {
                    await db.collection('branches').doc(branchId).delete();
                } catch (error) {
                    console.error('Error al eliminar sucursal:', error);
                    alert('Error al eliminar la sucursal');
                }
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingBranch(null);
                setFormData({
                    name: '',
                    code: '',
                    type: 'Normal',
                    isActive: true
                });
            };

            return (
                <div className="p-4 md:p-6 lg:p-8">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-3xl font-bold text-gray-800">Gestión de Sucursales</h2>
                        <button
                            onClick={() => setIsModalOpen(true)}
                            className="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700"
                        >
                            <Icon name="PlusCircle" size={18} />
                            Nueva Sucursal
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-md overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Nombre</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Código</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Tipo</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Estado</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {branches?.map(branch => (
                                        <tr key={branch.id} className="border-b hover:bg-gray-50">
                                            <td className="p-4 text-sm font-medium">{branch.name}</td>
                                            <td className="p-4 text-sm font-mono text-blue-600">{branch.code}</td>
                                            <td className="p-4 text-sm">{branch.type}</td>
                                            <td className="p-4 text-sm">
                                                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                                    branch.isActive !== false ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                                }`}>
                                                    {branch.isActive !== false ? 'Activa' : 'Inactiva'}
                                                </span>
                                            </td>
                                            <td className="p-4 text-sm">
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => handleEdit(branch)}
                                                        className="text-blue-600 hover:text-blue-800 p-1"
                                                    >
                                                        <Icon name="Edit" size={16} />
                                                    </button>
                                                    <button
                                                        onClick={() => handleDelete(branch.id)}
                                                        className="text-red-600 hover:text-red-800 p-1"
                                                    >
                                                        <Icon name="Trash2" size={16} />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal
                        isOpen={isModalOpen}
                        onClose={handleCloseModal}
                        title={editingBranch ? 'Editar Sucursal' : 'Nueva Sucursal'}
                    >
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                                <input
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Código</label>
                                <input
                                    type="text"
                                    value={formData.code}
                                    onChange={(e) => setFormData({...formData, code: e.target.value.toUpperCase()})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                                <select
                                    value={formData.type}
                                    onChange={(e) => setFormData({...formData, type: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="Normal">Normal</option>
                                    <option value="Remate">Remate</option>
                                </select>
                            </div>
                            <div className="flex items-center">
                                <input
                                    type="checkbox"
                                    id="isActive"
                                    checked={formData.isActive}
                                    onChange={(e) => setFormData({...formData, isActive: e.target.checked})}
                                    className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                />
                                <label htmlFor="isActive" className="ml-2 block text-sm text-gray-700">
                                    Sucursal activa
                                </label>
                            </div>
                            <div className="flex justify-end gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={handleCloseModal}
                                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="submit"
                                    disabled={isLoading}
                                    className="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {isLoading ? <Spinner small /> : (editingBranch ? 'Actualizar' : 'Crear')}
                                </button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        }

        function UserManagement({ branches }) {
            const [users, setUsers] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [newUserUID, setNewUserUID] = useState(null);
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [formData, setFormData] = useState({
                email: '',
                password: '',
                userName: '',
                branchId: '',
                canCreateShipment: false,
                canConfirmReceipt: false,
                canResolveIncidents: false,
                canManageBranches: false,
                canManageUsers: false,
                isAdmin: false
            });

            useEffect(() => {
                const unsubscribe = db.collection('user_permissions').onSnapshot(async (snapshot) => {
                    const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(list);

                    const ops = [];
                    list.forEach(u => {
                        const hasUpper = u && u.BranchId !== undefined && u.branchId === undefined;
                        if (hasUpper) {
                            ops.push(
                                db.collection('user_permissions')
                                    .doc(u.id)
                                    .update({
                                        branchId: u.BranchId,
                                        BranchId: firebase.firestore.FieldValue.delete()
                                    })
                            );
                        }
                    });
                    if (ops.length) {
                        try { await Promise.all(ops); } catch (e) {}
                    }
                });
                return unsubscribe;
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                
                try {
                    if (!formData.email || !formData.userName || !formData.branchId) {
                        alert('Por favor complete todos los campos obligatorios');
                        setIsLoading(false);
                        return;
                    }
                    
                    if (!editingUser && (!formData.password || formData.password.length < 6)) {
                        alert('La contraseña debe tener al menos 6 caracteres');
                        setIsLoading(false);
                        return;
                    }
                    
                    const selectedBranch = branches?.find(b => b.id === formData.branchId);
                    const branchName = selectedBranch ? selectedBranch.name : '';
                    
                    if (editingUser) {
                        const updateData = {
                            userName: formData.userName,
                            branchId: formData.branchId,
                            branchName: branchName,
                            canCreateShipment: formData.canCreateShipment,
                            canConfirmReceipt: formData.canConfirmReceipt,
                            canResolveIncidents: formData.canResolveIncidents,
                            canManageBranches: formData.canManageBranches,
                            canManageUsers: formData.canManageUsers,
                            isAdmin: formData.isAdmin
                        };
                        await db.collection('user_permissions').doc(editingUser.id).update(updateData);
                    } else {
                        const secondary = firebase.apps.find(a => a.name === 'Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
                        const secondaryAuth = secondary.auth();
                        const userCredential = await secondaryAuth.createUserWithEmailAndPassword(formData.email, formData.password);
                        const uid = userCredential.user.uid;
                        
                        await db.collection('user_permissions').doc(uid).set({
                            email: formData.email,
                            userName: formData.userName,
                            branchId: formData.branchId,
                            branchName: branchName,
                            canCreateShipment: formData.canCreateShipment,
                            canConfirmReceipt: formData.canConfirmReceipt,
                            canResolveIncidents: formData.canResolveIncidents,
                            canManageBranches: formData.canManageBranches,
                            canManageUsers: formData.canManageUsers,
                            isAdmin: formData.isAdmin,
                            createdAt: Timestamp.now()
                        });
                        
                        // Store the UID and show success modal
                        setNewUserUID(uid);
                        setShowSuccessModal(true);
                        
                        try { await secondaryAuth.signOut(); } catch (e) {}
                        try { await secondary.delete(); } catch (e) {}
                    }
                    
                    if (editingUser) {
                        handleCloseModal();
                    }
                } catch (error) {
                    console.error('Error al guardar usuario:', error);
                    if (error.code === 'auth/email-already-in-use') {
                        alert('Este email ya está registrado');
                    } else if (error.code === 'auth/weak-password') {
                        alert('La contraseña es muy débil');
                    } else if (error.code === 'auth/invalid-email') {
                        alert('El formato del email no es válido');
                    } else {
                        alert('Error al guardar el usuario: ' + error.message);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const handleEdit = (user) => {
                setEditingUser(user);
                setFormData({
                    email: user.email || '',
                    password: '',
                    userName: user.userName || '',
                    branchId: user.branchId || '',
                    canCreateShipment: user.canCreateShipment || false,
                    canConfirmReceipt: user.canConfirmReceipt || false,
                    canResolveIncidents: user.canResolveIncidents || false,
                    canManageBranches: user.canManageBranches || false,
                    canManageUsers: user.canManageUsers || false,
                    isAdmin: user.isAdmin || false
                });
                setIsModalOpen(true);
            };

            const handleDelete = async (userId) => {
                if (!confirm('¿Está seguro de eliminar este usuario?')) return;
                
                try {
                    await db.collection('user_permissions').doc(userId).delete();
                } catch (error) {
                    console.error('Error al eliminar usuario:', error);
                    alert('Error al eliminar el usuario');
                }
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingUser(null);
                setFormData({
                    email: '',
                    password: '',
                    userName: '',
                    branchId: '',
                    canCreateShipment: false,
                    canConfirmReceipt: false,
                    canResolveIncidents: false,
                    canManageBranches: false,
                    canManageUsers: false,
                    isAdmin: false
                });
            };

            const handleCloseSuccessModal = () => {
                setShowSuccessModal(false);
                setNewUserUID(null);
                handleCloseModal();
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    alert('ID de usuario copiado al portapapeles');
                }).catch(() => {
                    // Fallback for older browsers
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('ID de usuario copiado al portapapeles');
                });
            };

            const getBranchName = (branchId) => {
                const branch = branches?.find(b => b.id === branchId);
                return branch ? branch.name : 'Sin asignar';
            };

            return (
                <div className="p-4 md:p-6 lg:p-8">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-3xl font-bold text-gray-800">Gestión de Usuarios</h2>
                        <button
                            onClick={() => setIsModalOpen(true)}
                            className="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700"
                        >
                            <Icon name="PlusCircle" size={18} />
                            Nuevo Usuario
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-md overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Email</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Nombre</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Sucursal</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Permisos</th>
                                        <th className="p-4 text-left text-sm font-semibold text-gray-600">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {users.map(user => (
                                        <tr key={user.id} className="border-b hover:bg-gray-50">
                                            <td className="p-4 text-sm font-medium">{user.email}</td>
                                            <td className="p-4 text-sm">{user.userName || 'Sin nombre'}</td>
                                            <td className="p-4 text-sm">{getBranchName(user.branchId)}</td>
                                            <td className="p-4 text-sm">
                                                <div className="flex flex-wrap gap-1">
                                                    {PERMISSIONS_CONFIG.map(perm => (
                                                        user[perm.id] && (
                                                            <span key={perm.id} className="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full">
                                                                {perm.label}
                                                            </span>
                                                        )
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="p-4 text-sm">
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => handleEdit(user)}
                                                        className="text-blue-600 hover:text-blue-800 p-1"
                                                    >
                                                        <Icon name="Edit" size={16} />
                                                    </button>
                                                    <button
                                                        onClick={() => handleDelete(user.id)}
                                                        className="text-red-600 hover:text-red-800 p-1"
                                                    >
                                                        <Icon name="Trash2" size={16} />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal
                        isOpen={isModalOpen}
                        onClose={handleCloseModal}
                        title={editingUser ? 'Editar Usuario' : 'Nuevo Usuario'}
                        size="lg"
                    >
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input
                                    type="email"
                                    value={formData.email}
                                    onChange={(e) => setFormData({...formData, email: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    disabled={!!editingUser}
                                    required
                                />
                            </div>
                            {!editingUser && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                    <input
                                        type="password"
                                        value={formData.password}
                                        onChange={(e) => setFormData({...formData, password: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        required
                                        minLength="6"
                                        placeholder="Mínimo 6 caracteres"
                                    />
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Nombre del Usuario</label>
                                <input
                                    type="text"
                                    value={formData.userName}
                                    onChange={(e) => setFormData({...formData, userName: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Nombre completo del usuario"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Sucursal</label>
                                <select
                                    value={formData.branchId}
                                    onChange={(e) => setFormData({...formData, branchId: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                >
                                    <option value="">Seleccionar sucursal</option>
                                    {branches?.filter(b => b.isActive !== false).map(branch => (
                                        <option key={branch.id} value={branch.id}>{branch.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">Permisos</label>
                                <div className="space-y-2">
                                    {PERMISSIONS_CONFIG.map(perm => (
                                        <div key={perm.id} className="flex items-center">
                                            <input
                                                type="checkbox"
                                                id={perm.id}
                                                checked={formData[perm.id]}
                                                onChange={(e) => setFormData({...formData, [perm.id]: e.target.checked})}
                                                className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                            />
                                            <label htmlFor={perm.id} className="ml-2 block text-sm text-gray-700">
                                                {perm.label}
                                            </label>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex justify-end gap-3 pt-4">
                                <button
                                    type="button"
                                    onClick={handleCloseModal}
                                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="submit"
                                    disabled={isLoading}
                                    className="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50"
                                >
                                    {isLoading ? <Spinner small /> : (editingUser ? 'Actualizar' : 'Crear')}
                                </button>
                            </div>
                        </form>
                    </Modal>

                    {/* Success Modal for New User UID */}
                    <Modal
                        isOpen={showSuccessModal}
                        onClose={handleCloseSuccessModal}
                        title="Usuario Creado Exitosamente"
                        size="md"
                    >
                        <div className="space-y-4">
                            <div className="text-center">
                                <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                                    <Icon name="CheckCircle" size={24} className="text-green-600" />
                                </div>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">
                                    ¡Usuario creado correctamente!
                                </h3>
                                <p className="text-sm text-gray-600 mb-4">
                                    El usuario ha sido registrado en el sistema. Aquí está su ID único para darlo de alta:
                                </p>
                            </div>
                            
                            <div className="bg-gray-50 border border-gray-200 rounded-lg p-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    ID de Usuario (UID):
                                </label>
                                <div className="flex items-center gap-2">
                                    <input
                                        type="text"
                                        value={newUserUID || ''}
                                        readOnly
                                        className="flex-1 px-3 py-2 bg-white border border-gray-300 rounded-md text-sm font-mono text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                    <button
                                        onClick={() => copyToClipboard(newUserUID)}
                                        className="flex items-center gap-1 px-3 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        title="Copiar ID al portapapeles"
                                    >
                                        <Icon name="Copy" size={16} />
                                        Copiar
                                    </button>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    Guarda este ID para dar de alta al usuario en el sistema
                                </p>
                            </div>

                            <div className="flex justify-center pt-4">
                                <button
                                    onClick={handleCloseSuccessModal}
                                    className="px-6 py-2 bg-green-600 text-white font-medium rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500"
                                >
                                    Entendido
                                </button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        function ShipmentManagement({ branches, currentBranchId, userId, userPermissions }) {
            const [shipments, setShipments] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [statusFilter, setStatusFilter] = useState('Todos');
            const [activeTab, setActiveTab] = useState('created');
            const [selectedShipment, setSelectedShipment] = useState(null);
            const [showReceptionForm, setShowReceptionForm] = useState(false);
            const [showResolveForm, setShowResolveForm] = useState(false);
            const [showCloseForm, setShowCloseForm] = useState(false);
            const [showShipmentSheet, setShowShipmentSheet] = useState(false);

            useEffect(() => {
                if (!userPermissions) return;
                let unsubscribes = [];

                if (userPermissions.isAdmin) {
                    const unsub = db.collection('shipments').onSnapshot(snapshot => {
                        setShipments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubscribes.push(unsub);
                } else if (currentBranchId) {
                    let originDocs = [];
                    let destDocs = [];

                    const mergeAndSet = () => {
                        const map = new Map();
                        originDocs.forEach(d => map.set(d.id, d));
                        destDocs.forEach(d => map.set(d.id, d));
                        setShipments(Array.from(map.values()));
                    };

                    const unsub1 = db.collection('shipments')
                        .where('originBranchId', '==', currentBranchId)
                        .onSnapshot(snapshot => {
                            originDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            mergeAndSet();
                        });

                    const unsub2 = db.collection('shipments')
                        .where('destinationBranchId', '==', currentBranchId)
                        .onSnapshot(snapshot => {
                            destDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            mergeAndSet();
                        });

                    unsubscribes.push(unsub1, unsub2);
                }

                return () => {
                    unsubscribes.forEach(u => { try { u && u(); } catch (e) {} });
                };
            }, [userPermissions, currentBranchId]);

            const handleStatusUpdate = async (shipmentId, newStatus) => {
                try {
                    const updateData = {
                        status: newStatus,
                        lastUpdated: Timestamp.now(),
                        history: firebase.firestore.FieldValue.arrayUnion({
                            action: `Estado actualizado a ${newStatus}`,
                            timestamp: Timestamp.now(),
                            userId: userId
                        })
                    };

                    await db.collection('shipments').doc(shipmentId).update(updateData);
                } catch (error) {
                    console.error('Error al actualizar estado:', error);
                    alert('Error al actualizar el estado');
                }
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setSelectedShipment(null);
                setShowReceptionForm(false);
                setShowResolveForm(false);
                setShowCloseForm(false);
                setShowShipmentSheet(false);
            };

            const getStatusActions = (shipment) => {
                const actions = [];
                const isOriginBranch = shipment.originBranchId === currentBranchId;
                const isDestinationBranch = shipment.destinationBranchId === currentBranchId;
                
                if (isDestinationBranch && shipment.status === 'En Tránsito') {
                    actions.push({
                        label: 'Recibir',
                        action: () => {
                            setSelectedShipment(shipment);
                            setShowReceptionForm(true);
                        },
                        icon: 'PackageCheck',
                        color: 'bg-green-600 hover:bg-green-700'
                    });
                }
                
                if (isOriginBranch && shipment.status?.includes('Incidencia') && !shipment.status.includes('Resuelta')) {
                    actions.push({
                        label: 'Resolver',
                        action: () => {
                            setSelectedShipment(shipment);
                            setShowResolveForm(true);
                        },
                        icon: 'CheckCircle',
                        color: 'bg-blue-600 hover:bg-blue-700'
                    });
                }
                
                if (isOriginBranch && (shipment.status === 'Recibido' || shipment.status?.includes('Resuelta') || shipment.status === 'Pendiente de Liquidación')) {
                    actions.push({
                        label: 'Cerrar',
                        action: () => {
                            setSelectedShipment(shipment);
                            setShowCloseForm(true);
                        },
                        icon: 'Lock',
                        color: 'bg-purple-600 hover:bg-purple-700'
                    });
                }
                
                actions.push({
                    label: 'Hoja',
                    action: () => {
                        setSelectedShipment(shipment);
                        setShowShipmentSheet(true);
                    },
                    icon: 'Printer',
                    color: 'bg-gray-600 hover:bg-gray-700'
                });
                
                return actions;
            };

            const filteredShipments = useMemo(() => {
                let filtered = shipments;
                
                if (userPermissions?.isAdmin) {
                    if (activeTab === 'created') {
                        // Show all created shipments for admin
                    } else if (activeTab === 'pending') {
                        filtered = filtered.filter(s => s.status === 'En Tránsito');
                    } else if (activeTab === 'all') {
                        // Show all shipments for admin
                    }
                } else {
                    if (activeTab === 'created') {
                        filtered = filtered.filter(s => s.originBranchId === currentBranchId);
                    } else {
                        filtered = filtered.filter(s => s.destinationBranchId === currentBranchId && s.status === 'En Tránsito');
                    }
                }
                
                if (statusFilter !== 'Todos') {
                    filtered = filtered.filter(s => s.status === statusFilter);
                }
                
                return filtered;
            }, [shipments, activeTab, statusFilter, currentBranchId, userPermissions]);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-900">Gestión de Salidas</h2>
                        <button
                            onClick={() => setIsModalOpen(true)}
                            className="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors"
                        >
                            <Icon name="Plus" size={20} />
                            Nueva Salida
                        </button>
                    </div>

                    <div className="bg-white rounded-lg shadow-md">
                        <div className="border-b border-gray-200">
                            <nav className="-mb-px flex">
                                <button
                                    onClick={() => setActiveTab('created')}
                                    className={`py-2 px-4 border-b-2 font-medium text-sm ${
                                        activeTab === 'created'
                                            ? 'border-blue-500 text-blue-600'
                                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    {userPermissions?.isAdmin ? 'Todas las Salidas Creadas' : 'Mis Salidas Creadas'}
                                </button>
                                <button
                                    onClick={() => setActiveTab('pending')}
                                    className={`py-2 px-4 border-b-2 font-medium text-sm ${
                                        activeTab === 'pending'
                                            ? 'border-blue-500 text-blue-600'
                                            : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                    }`}
                                >
                                    {userPermissions?.isAdmin ? 'Todas las Recepciones Pendientes' : 'Recepciones Pendientes'}
                                </button>
                                {userPermissions?.isAdmin && (
                                    <button
                                        onClick={() => setActiveTab('all')}
                                        className={`py-2 px-4 border-b-2 font-medium text-sm ${
                                            activeTab === 'all'
                                                ? 'border-blue-500 text-blue-600'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                        }`}
                                    >
                                        Todas las Salidas
                                    </button>
                                )}
                            </nav>
                        </div>

                        <div className="p-6">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-4">
                                    <select
                                        value={statusFilter}
                                        onChange={(e) => setStatusFilter(e.target.value)}
                                        className="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="Todos">Todos los estados</option>
                                        <option value="En Tránsito">En Tránsito</option>
                                        <option value="Recibido">Recibido</option>
                                        <option value="Cerrado">Cerrado</option>
                                    </select>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Folio</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Origen</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Destino</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Artículos</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {filteredShipments.map((shipment) => (
                                            <tr key={shipment.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                                    {shipment.id}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {shipment.type}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {branches.find(b => b.id === shipment.originBranchId)?.name || 'N/A'}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {branches.find(b => b.id === shipment.destinationBranchId)?.name || 'N/A'}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <span className={`inline-flex px-2 py-1 text-xs font-semibold rounded-full ${
                                                        shipment.status === 'En Tránsito' ? 'bg-yellow-100 text-yellow-800' :
                                                        shipment.status === 'Recibido' ? 'bg-green-100 text-green-800' :
                                                        shipment.status === 'Cerrado' ? 'bg-gray-100 text-gray-800' :
                                                        shipment.status?.includes('Incidencia') ? 'bg-red-100 text-red-800' :
                                                        'bg-blue-100 text-blue-800'
                                                    }`}>
                                                        {shipment.status}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {shipment.items?.length || 0}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {shipment.createdAt?.toDate?.()?.toLocaleDateString() || 'N/A'}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                    <div className="flex gap-2">
                                                        {getStatusActions(shipment).map((action, index) => (
                                                            <button
                                                                key={index}
                                                                onClick={action.action}
                                                                className={`inline-flex items-center gap-1 px-3 py-1 text-xs font-medium text-white rounded-md transition-colors ${action.color}`}
                                                                title={action.label}
                                                            >
                                                                <Icon name={action.icon} size={14} />
                                                                {action.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {filteredShipments.length === 0 && (
                                <div className="text-center py-8">
                                    <Icon name="PackageSearch" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <p className="text-gray-500">No se encontraron salidas</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {isModalOpen && (
                        <ShipmentForm
                            isOpen={isModalOpen}
                            onClose={handleCloseModal}
                            branches={branches}
                            currentBranchId={currentBranchId}
                            userId={userId}
                        />
                    )}

                    {showReceptionForm && selectedShipment && (
                        <ReceptionForm
                            isOpen={showReceptionForm}
                            onClose={handleCloseModal}
                            shipment={selectedShipment}
                            currentBranchId={currentBranchId}
                            userId={userId}
                        />
                    )}

                    {showResolveForm && selectedShipment && (
                        <ResolveIncidentForm
                            isOpen={showResolveForm}
                            onClose={handleCloseModal}
                            shipment={selectedShipment}
                            userId={userId}
                        />
                    )}

                    {showCloseForm && selectedShipment && (
                        <CloseCycleForm
                            isOpen={showCloseForm}
                            onClose={handleCloseModal}
                            shipment={selectedShipment}
                            userId={userId}
                            currentBranchId={currentBranchId}
                        />
                    )}

                    {showShipmentSheet && selectedShipment && (
                        <ShipmentSheet
                            isOpen={showShipmentSheet}
                            onClose={handleCloseModal}
                            shipment={selectedShipment}
                            branches={branches}
                        />
                    )}
                </div>
            );
        }

        function ReceptionForm({ isOpen, onClose, shipment, currentBranchId, userId }) {
            const [isLoading, setIsLoading] = useState(false);
            const [dotacion, setDotacion] = useState('');
            const [comments, setComments] = useState('');
            const [itemStatuses, setItemStatuses] = useState({});

            useEffect(() => {
                if (shipment?.items) {
                    const initialStatuses = {};
                    shipment.items.forEach(item => {
                        initialStatuses[item.id] = 'OK';
                    });
                    setItemStatuses(initialStatuses);
                }
            }, [shipment]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);

                try {
                    const hasIncidents = Object.values(itemStatuses).some(status => status !== 'OK');
                    const incidentItems = Object.entries(itemStatuses)
                        .filter(([_, status]) => status !== 'OK')
                        .map(([itemId, status]) => ({ itemId, status }));

                    let newStatus = 'Recibido';
                    if (hasIncidents) {
                        const hasMissing = Object.values(itemStatuses).some(status => status === 'Faltante');
                        const hasDamaged = Object.values(itemStatuses).some(status => status === 'Dañado');
                        
                        if (hasMissing && hasDamaged) {
                            newStatus = 'Recibido con Incidencia (Faltante y Dañado)';
                        } else if (hasMissing) {
                            newStatus = 'Recibido con Incidencia (Faltante)';
                        } else {
                            newStatus = 'Recibido con Incidencia (Dañado)';
                        }
                    }

                    const updateData = {
                        status: newStatus,
                        receivedAt: Timestamp.now(),
                        lastUpdated: Timestamp.now(),
                        dotacion: dotacion,
                        receptionComments: comments,
                        itemStatuses: itemStatuses,
                        incidentItems: hasIncidents ? incidentItems : [],
                        history: firebase.firestore.FieldValue.arrayUnion({
                            action: `Recibido${hasIncidents ? ' con Incidencia' : ''}`,
                            timestamp: Timestamp.now(),
                            userId: userId,
                            details: `Dotación: ${dotacion}. ${hasIncidents ? `Incidencias: ${incidentItems.length} artículos` : 'Sin incidencias'}`
                        })
                    };

                    await db.collection('shipments').doc(shipment.id).update(updateData);
                    onClose();
                } catch (error) {
                    console.error('Error al recibir salida:', error);
                    alert('Error al procesar la recepción');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleStatusChange = (itemId, status) => {
                setItemStatuses(prev => ({
                    ...prev,
                    [itemId]: status
                }));
            };

            return (
                <Modal
                    isOpen={isOpen}
                    onClose={onClose}
                    title={`Recibir Salida - ${shipment?.id}`}
                    size="xl"
                >
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Número de Dotación</label>
                                <input
                                    type="text"
                                    value={dotacion}
                                    onChange={(e) => setDotacion(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Comentarios Generales</label>
                                <textarea
                                    value={comments}
                                    onChange={(e) => setComments(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    rows="2"
                                />
                            </div>
                        </div>

                        <div>
                            <h3 className="text-lg font-medium text-gray-900 mb-4">Verificación de Artículos</h3>
                            <div className="space-y-3 max-h-96 overflow-y-auto">
                                {shipment?.items?.map((item, index) => (

                                                    Dañado
                                                </button>

                                        </div>
                                    </div>
