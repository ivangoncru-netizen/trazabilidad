    <script type="text/babel">
        // --- Configuración de Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyBUQT92ByHpcyzVgq7kmE2aZqFTlkPqb0E",
            authDomain: "trazabilidad-66c41.firebaseapp.com",
            projectId: "trazabilidad-66c41",

            messagingSenderId: "550997318348",
            appId: "1:550997318348:web:631f113dfef0b5ab2a8069"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Constantes y Hooks ---
        const appId = "trazabilidad-66c41";
        const { useState, useEffect, useMemo } = React;
        const [__initLoginFlag] = [true];
        
        // --- MEJORAS IMPLEMENTADAS PARA CIERRES PERFECTOS ---
        
        // 1. Sistema de Notificaciones Push Mejorado
        const NotificationSystem = {
            // Crear notificación para cierre pendiente
            createPendingClosureNotification: async (shipmentId, branchId, missingData) => {
                try {
                    const notification = {
                        id: `pending-closure-${shipmentId}-${Date.now()}`,
                        type: 'pending_closure',
                        title: 'Cierre Pendiente',
                        message: `El envío ${shipmentId} requiere ${missingData} para completar el cierre`,
                        shipmentId: shipmentId,
                        targetBranchId: branchId,
                        priority: 'high',
                        createdAt: firebase.firestore.Timestamp.now(),
                        read: false,
                        autoExpire: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)) // 7 días
                    };
                    
                    await db.collection('notifications').add(notification);
                    
                    // Programar recordatorios
                    setTimeout(() => {
                        NotificationSystem.sendReminder(shipmentId, branchId, missingData);
                    }, 24 * 60 * 60 * 1000); // Recordatorio en 24 horas
                    
                } catch (error) {
                    console.error('Error creando notificación:', error);
                }
            },
            
            // Enviar recordatorio
            sendReminder: async (shipmentId, branchId, missingData) => {
                try {
                    // Verificar si el cierre ya se completó
                    const shipmentDoc = await db.collection('shipments').doc(shipmentId).get();
                    if (shipmentDoc.exists && shipmentDoc.data().status === 'Cerrado') {
                        return; // Ya se cerró, no enviar recordatorio
                    }
                    
                    const reminder = {
                        id: `reminder-${shipmentId}-${Date.now()}`,
                        type: 'closure_reminder',
                        title: 'Recordatorio: Cierre Pendiente',
                        message: `URGENTE: El envío ${shipmentId} lleva más de 24 horas esperando ${missingData}`,
                        shipmentId: shipmentId,
                        targetBranchId: branchId,
                        priority: 'urgent',
                        createdAt: firebase.firestore.Timestamp.now(),
                        read: false
                    };
                    
                    await db.collection('notifications').add(reminder);
                } catch (error) {
                    console.error('Error enviando recordatorio:', error);
                }
            }
        };
        
        // 2. Sistema de Validación Cruzada
        const CrossValidationSystem = {
            // Validar folio contra sistema origen
            validateOriginFolio: async (shipmentId, folio, originBranchId) => {
                try {
                    // Verificar formato del folio
                    const folioPattern = /^[A-Z]{2,4}-\d{6,8}$/;
                    if (!folioPattern.test(folio)) {
                        throw new Error('Formato de folio inválido. Use formato: ABC-123456');
                    }
                    
                    // Verificar que el folio no esté duplicado
                    const duplicateCheck = await db.collection('shipments')
                        .where('folioSalidaOrigen', '==', folio)
                        .where('originBranchId', '==', originBranchId)
                        .get();
                    
                    const hasDuplicate = duplicateCheck.docs.some(doc => doc.id !== shipmentId);
                    if (hasDuplicate) {
                        throw new Error('Este folio ya está registrado en otro envío');
                    }
                    
                    // Log de validación
                    await db.collection('validation_logs').add({
                        type: 'folio_validation',
                        shipmentId: shipmentId,
                        folio: folio,
                        branchId: originBranchId,
                        status: 'valid',
                        timestamp: firebase.firestore.Timestamp.now()
                    });
                    
                    return { valid: true, message: 'Folio validado correctamente' };
                } catch (error) {
                    // Log de error de validación
                    await db.collection('validation_logs').add({
                        type: 'folio_validation',
                        shipmentId: shipmentId,
                        folio: folio,
                        branchId: originBranchId,
                        status: 'invalid',
                        error: error.message,
                        timestamp: firebase.firestore.Timestamp.now()
                    });
                    
                    return { valid: false, message: error.message };
                }
            },
            
            // Validar número de dotación
            validateDotacionNumber: async (shipmentId, dotacion, destinationBranchId) => {
                try {
                    // Verificar formato de dotación
                    const dotacionPattern = /^DOT-\d{6,8}$/;
                    if (!dotacionPattern.test(dotacion)) {
                        throw new Error('Formato de dotación inválido. Use formato: DOT-123456');
                    }
                    
                    // Verificar que la dotación no esté duplicada
                    const duplicateCheck = await db.collection('shipments')
                        .where('numeroDotacionDestino', '==', dotacion)
                        .where('destinationBranchId', '==', destinationBranchId)
                        .get();
                    
                    const hasDuplicate = duplicateCheck.docs.some(doc => doc.id !== shipmentId);
                    if (hasDuplicate) {
                        throw new Error('Este número de dotación ya está registrado');
                    }
                    
                    // Log de validación
                    await db.collection('validation_logs').add({
                        type: 'dotacion_validation',
                        shipmentId: shipmentId,
                        dotacion: dotacion,
                        branchId: destinationBranchId,
                        status: 'valid',
                        timestamp: firebase.firestore.Timestamp.now()
                    });
                    
                    return { valid: true, message: 'Dotación validada correctamente' };
                } catch (error) {
                    // Log de error de validación
                    await db.collection('validation_logs').add({
                        type: 'dotacion_validation',
                        shipmentId: shipmentId,
                        dotacion: dotacion,
                        branchId: destinationBranchId,
                        status: 'invalid',
                        error: error.message,
                        timestamp: firebase.firestore.Timestamp.now()
                    });
                    
                    return { valid: false, message: error.message };
                }
            }
        };
        
        // 3. Sistema de Logs Detallados
        const DetailedLoggingSystem = {
            // Log de acción de cierre
            logClosureAction: async (shipmentId, action, details, userId) => {
                try {
                    await db.collection('closure_logs').add({
                        shipmentId: shipmentId,
                        action: action,
                        details: details,
                        userId: userId,
                        timestamp: firebase.firestore.Timestamp.now(),
                        sessionId: `session-${Date.now()}`
                    });
                } catch (error) {
                    console.error('Error logging closure action:', error);
                }
            },
            
            // Log de error
            logError: async (shipmentId, error, context, userId) => {
                try {
                    await db.collection('closure_logs').add({
                        shipmentId: shipmentId,
                        action: 'error',
                        error: error.message,
                        context: context,
                        userId: userId,
                        timestamp: firebase.firestore.Timestamp.now(),
                        level: 'error'
                    });
                } catch (logError) {
                    console.error('Error logging error:', logError);
                }
            }
        };
        
        // 4. Sistema de Manejo Robusto de Errores
        const ErrorHandlingSystem = {
            // Ejecutar con reintentos
            executeWithRetry: async (operation, maxRetries = 3, backoffMs = 1000) => {
                let lastError;
                
                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    try {
                        return await operation();
                    } catch (error) {
                        lastError = error;
                        console.warn(`Intento ${attempt} falló:`, error.message);
                        
                        if (attempt < maxRetries) {
                            // Backoff exponencial
                            const delay = backoffMs * Math.pow(2, attempt - 1);
                            await new Promise(resolve => setTimeout(resolve, delay));
                        }
                    }
                }
                
                throw lastError;
            },
            
            // Manejar errores de conectividad
            handleConnectivityError: async (error, operation) => {
                if (error.code === 'unavailable' || error.message.includes('network')) {
                    console.log('Error de conectividad detectado, reintentando...');
                    return await ErrorHandlingSystem.executeWithRetry(operation, 3, 2000);
                }
                throw error;
            }
        };

        
        // --- Función para generar folios únicos ---
        const generateNewFolio = async (branchId, branchCode) => {
            try {
                const counterRef = db.collection('branch_counters').doc(branchId);
                
                return await db.runTransaction(async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    
                    let newCounter = 1;
                    if (counterDoc.exists) {
                        newCounter = (counterDoc.data().lastFolio || 0) + 1;
                    }
                    
                    transaction.set(counterRef, { lastFolio: newCounter }, { merge: true });
                    
                    return `${branchCode}-${String(newCounter).padStart(6, '0')}`;
                });
            } catch (error) {
                console.error('Error generating folio:', error);
                throw error;
            }
        };
        const { Timestamp } = firebase.firestore;
        
        // --- Iconos (reemplazo de lucide-react) ---
        const icons = { Home: <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>, Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>, Truck: <><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4h-8v-4Z"/><circle cx="7.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/></>, PlusCircle: <><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></>, Edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>, Trash2: <><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></>, Bell: <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>, Building: <><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></>, X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>, Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>, FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></>, ShieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></>, PackagePlus: <><path d="M16 16h6"/><path d="M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 2 2h5"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>, Trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>, Eye: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>, Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>, FileDown: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m15 15-3 3-3-3"/></>, HelpCircle: <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>, Package: <><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 2 2h5"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>, BarChart3: <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>, User: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>, ScanLine: <><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></>, Printer: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></>, CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>, AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>, PackageSearch: <><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 2 2h5"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/><circle cx="18.5" cy="15.5" r="2.5"/><path d="m20.5 17.5-1.5-1.5"/></>, Lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>};
        const Icon = ({ name, size = 24, className = '' }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`lucide-icon ${className}`}>{icons[name]}</svg>);

        // --- COMPONENTES AUXILIARES ---
        const Modal = ({ children, isOpen, onClose, title, size = 'md' })=>{ if(!isOpen)return null; const sizeClasses={sm:'max-w-sm',md:'max-w-md',lg:'max-w-3xl',xl:'max-w-6xl',full:'max-w-full h-full'}; return(<div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex justify-center items-center p-0 md:p-4"><div className={`bg-white ${size==='full'?'w-full h-full':`rounded-2xl max-h-[90vh] ${sizeClasses[size]}`} shadow-2xl m-0 md:m-4 flex flex-col`}><div className="flex justify-between items-center p-4 border-b"><h3 className="text-xl font-semibold">{title}</h3><button onClick={onClose} className="text-gray-400 hover:text-gray-600 p-2 rounded-full"><Icon name="X" size={24} /></button></div><div className="p-2 md:p-6 overflow-y-auto">{children}</div></div></div>); };
        const Spinner = ({ small = false })=>{ return(<div className={`flex justify-center items-center ${!small && 'h-full'}`}><div className={`animate-spin rounded-full border-t-4 border-b-4 border-blue-500 ${small ? 'h-6 w-6' : 'h-16 w-16'}`}></div></div>); };
        
        // --- COMPONENTES DE LA APLICACIÓN (DEFINIDOS ANTES DE USARSE) ---
        
        const PERMISSIONS_CONFIG = [ { id: 'canCreateShipment', label: 'Crear Salida' }, { id: 'canConfirmReceipt', label: 'Confirmar Recepción' }, { id: 'canResolveIncidents', label: 'Resolver Incidencias' }, { id: 'canManageBranches', label: 'Admin. Sucursales' }, { id: 'canManageUsers', label: 'Admin. Usuarios' }, { id: 'isAdmin', label: 'Administrador del Sistema' } ];

        function Dashboard({ shipments, currentBranchId, userPermissions }) {
            const kpis = useMemo(() => {
                if (!shipments) return { enTransito: 0, conIncidencia: 0, cerradosHoy: 0 };
                const enTransito = shipments.filter(s => s.status === 'En Tránsito').length;
                const conIncidencia = shipments.filter(s => s.status && s.status.includes('Incidencia')).length;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const cerradosHoy = shipments.filter(s => {
                    if (!s.closedDate || !s.closedDate.toDate) return false;
                    const closedDate = s.closedDate.toDate();
                    return closedDate >= today && closedDate < tomorrow;
                }).length;
                return { enTransito, conIncidencia, cerradosHoy };
            }, [shipments]);

            const misTareas = useMemo(() => {
                if (!shipments) return [];
                if (userPermissions?.isAdmin) {
                    const recepciones = shipments.filter(s => s.status === 'En Tránsito');
                    const incidencias = shipments.filter(s => s.status && s.status.includes('Faltante'));
                    return [...recepciones, ...incidencias];
                }
                if (!currentBranchId) return [];
                const recepciones = shipments.filter(s => s.destinationBranchId === currentBranchId && s.status === 'En Tránsito');
                const incidencias = shipments.filter(s => s.originBranchId === currentBranchId && s.status && s.status.includes('Faltante'));
                return [...recepciones, ...incidencias];
            }, [shipments, currentBranchId, userPermissions]);

            const actividadReciente = useMemo(() => {
                if (!shipments) return [];
                return [...shipments]
                    .sort((a, b) => {
                        const timeA = a.lastUpdated?.toMillis ? a.lastUpdated.toMillis() : (a.createdAt?.toMillis() || 0);
                        const timeB = b.lastUpdated?.toMillis ? b.lastUpdated.toMillis() : (b.createdAt?.toMillis() || 0);
                        return timeB - timeA;
                    })
                    .slice(0, 5);
            }, [shipments]);

            return (
                <div className="p-4 md:p-6 lg:p-8">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6">Dashboard Principal</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-md"><h3 className="font-semibold text-gray-700">Folios en Tránsito</h3><p className="text-4xl font-bold text-blue-600 mt-2">{kpis.enTransito}</p></div>
                        <div className="bg-white p-6 rounded-xl shadow-md"><h3 className="font-semibold text-gray-700">Recibidos con Incidencia</h3><p className="text-4xl font-bold text-yellow-500 mt-2">{kpis.conIncidencia}</p></div>
                        <div className="bg-white p-6 rounded-xl shadow-md"><h3 className="font-semibold text-gray-700">Cerrados Hoy</h3><p className="text-4xl font-bold text-green-600 mt-2">{kpis.cerradosHoy}</p></div>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                        <div className="bg-white p-6 rounded-xl shadow-md">
                            <h3 className="font-semibold text-gray-700 mb-4">Mis Tareas Pendientes</h3>
                            {misTareas.length === 0 ? <p className="text-gray-500 text-sm">No tienes tareas pendientes.</p> : (
                                <ul className="divide-y divide-gray-200">
                                    {misTareas.map(tarea => (
                                        <li key={tarea.id} className="py-3">
                                            <p className="font-semibold text-sm">{tarea.status && tarea.status.includes('Tránsito') ? 'Recepción Pendiente:' : 'Incidencia por Resolver:'} <span className="font-mono text-blue-600">{tarea.id}</span></p>
                                            <p className="text-xs text-gray-500">De: {tarea.originBranchName} | Para: {tarea.destinationName}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-md">
                            <h3 className="font-semibold text-gray-700 mb-4">Actividad Reciente</h3>
                             {actividadReciente.length === 0 ? <p className="text-gray-500 text-sm">No hay actividad reciente.</p> : (
                                <ul className="divide-y divide-gray-200">
                                    {actividadReciente.map(act => (
                                        <li key={act.id} className="py-3">
                                            <p className="font-semibold text-sm">Folio: <span className="font-mono text-blue-600">{act.id}</span></p>
                                            <p className="text-xs text-gray-500">Último Estatus: <span className="font-semibold">{act.status}</span> - {act.lastUpdated?.toDate ? act.lastUpdated.toDate().toLocaleString() : 'N/A'}</p>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Reports({ shipments, currentBranchId, userPermissions }) {
            const [statusFilter, setStatusFilter] = useState('Todos');
            const [results, setResults] = useState([]);
            const [isLoading, setIsLoading] = useState(false);

            const handleGenerateReport = () => {
                setIsLoading(true);
                let filtered = userPermissions?.isAdmin ? shipments : shipments.filter(s => s.originBranchId === currentBranchId || s.destinationBranchId === currentBranchId);

                if (statusFilter !== 'Todos') {
                    filtered = filtered.filter(s => s.status === statusFilter);
                }

                setResults(filtered);
                setIsLoading(false);
            };
            
            const handleExportReport = () => {
                if (results.length === 0) {
                    alert("No hay datos para exportar. Genere un reporte primero.");
                    return;
                }
                const header = ["Folio", "Origen", "Destino", "Fecha", "Estatus"];
                const data = results.map(item => [
                    item.id,
                    item.originBranchName,
                    item.destinationName,
                    new Date(item.createdAt.toDate()).toLocaleString(),
                    item.status
                ]);
                const worksheetData = [header, ...data];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Reporte de Movimientos");
                XLSX.writeFile(wb, `Reporte-${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            return (
                <div className="p-4 md:p-6 lg:p-8">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6">Generador de Reportes</h2>
                    <div className="bg-white p-6 rounded-xl shadow-md mb-6">
                        <div className="flex items-end gap-4">
                            <div className="flex-1">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Estatus</label>
                                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white">
                                    <option value="Todos">Todos</option>
                                    <option>En Tránsito</option>
                                    <option>Recibido</option>
                                    <option>Recibido con Incidencia (Faltante)</option>
                                    <option>Recibido con Incidencia (Dañado)</option>
                                    <option>Incidencia Resuelta</option>
                                    <option>Cerrado</option>
                                </select>
                            </div>
                            <button onClick={handleGenerateReport} className="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700">
                                <Icon name="Search" size={18} /> Generar Reporte
                            </button>
                        </div>
                    </div>
                    
                    {isLoading ? <Spinner /> : (
                        <div className="bg-white p-6 rounded-xl shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-semibold text-lg">Resultados: {results.length}</h3>
                                {results.length > 0 && (
                                    <div className="flex gap-2">
                                        <button onClick={() => window.print()} className="flex items-center gap-2 bg-gray-600 text-white font-semibold py-2 px-3 rounded-lg shadow-md hover:bg-gray-700 text-sm"><Icon name="Printer" size={16}/> Imprimir</button>
                                        <button onClick={handleExportReport} className="flex items-center gap-2 bg-green-600 text-white font-semibold py-2 px-3 rounded-lg shadow-md hover:bg-green-700 text-sm"><Icon name="FileDown" size={16}/> Exportar a Excel</button>
                                    </div>
                                )}
                            </div>
                             <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="p-3 text-sm font-semibold text-gray-600">Folio</th>
                                            <th className="p-3 text-sm font-semibold text-gray-600">Origen</th>
                                            <th className="p-3 text-sm font-semibold text-gray-600">Destino</th>
                                            <th className="p-3 text-sm font-semibold text-gray-600">Fecha</th>
                                            <th className="p-3 text-sm font-semibold text-gray-600">Estatus</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {results.map(shipment => (
                                            <tr key={shipment.id} className="border-b">
                                                <td className="p-3 text-sm font-mono text-blue-600">{shipment.id}</td>
                                                <td className="p-3 text-sm">{shipment.originBranchName}</td>
                                                <td className="p-3 text-sm">{shipment.destinationName}</td>
                                                <td className="p-3 text-sm">{new Date(shipment.createdAt.toDate()).toLocaleDateString()}</td>
                                                <td className="p-3 text-sm">{shipment.status}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function LoginView() {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    const map = {
                        'auth/user-not-found': 'Usuario no encontrado',
                        'auth/wrong-password': 'Contraseña incorrecta',
                        'auth/invalid-email': 'Email inválido',
                        'auth/too-many-requests': 'Demasiados intentos, inténtalo más tarde'
                    };
                    setError(map[err.code] || 'Error al iniciar sesión');
                } finally {
                    setLoading(false);
                }
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <form onSubmit={handleLogin} className="bg-white p-8 rounded-xl shadow-md w-full max-w-sm space-y-4">
                        <div className="flex items-center gap-2 justify-center">
                            <Icon name="Package" size={28} className="text-blue-600" />
                            <h1 className="text-2xl font-bold">Iniciar Sesión</h1>
                        </div>
                        {error && <div className="text-red-600 text-sm">{error}</div>}
                        <div>
                            <label className="block text-sm mb-1">Email</label>
                            <input className="w-full border px-3 py-2 rounded" type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
                        </div>
                        <div>
                            <label className="block text-sm mb-1">Contraseña</label>
                            <input className="w-full border px-3 py-2 rounded" type="password" value={password} onChange={e=>setPassword(e.target.value)} required />
                        </div>
                        <button disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">{loading ? 'Ingresando...' : 'Ingresar'}</button>
                        <div className="mt-3 text-center">
                            <button
                                type="button"
                                onClick={async () => {
                                    if (!email) { alert('Ingresa tu email para restablecer la contraseña'); return; }
                                    try { await auth.sendPasswordResetEmail(email); alert('Se envió un correo para restablecer la contraseña'); }
                                    catch (e) { alert('No se pudo enviar el correo de restablecimiento'); }
                                }}
                                className="text-sm text-blue-600 hover:text-blue-800"
                            >
                                ¿Olvidaste tu contraseña?
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        
        function NotificationBell({ notifications }) {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="relative">
                    <button onClick={() => setIsOpen(!isOpen)} className="relative text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100">
                        <Icon name="Bell" size={24} />
                        {notifications.length > 0 && <span className="absolute top-1 right-1 block h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"></span>}
                    </button>
                    {isOpen && (
                        <div className="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border z-20">
                            <div className="p-3 font-semibold text-sm border-b">Notificaciones</div>
                            <div className="max-h-96 overflow-y-auto">
                                {notifications.length === 0 ? (<p className="text-center text-gray-500 text-sm py-4">No hay notificaciones nuevas.</p>) : (

                                        <div key={i} className="p-3 border-b hover:bg-gray-50 text-sm">
                                            <p className="font-semibold">{notif.title}</p>
                                            <p className="text-gray-600">{notif.message}</p>
                                            <p className="text-xs text-gray-400 mt-1">{notif.date?.toDate ? new Date(notif.date.toDate()).toLocaleString() : 'N/A'}</p>

                            </div>
                        </div>
