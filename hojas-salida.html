                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button
                                type="button"
                                onClick={onClose}
                                className="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors"
                            >
                                Cancelar
                            </button>
                            <button
                                type="submit"
                                disabled={isLoading}
                                className="flex items-center gap-2 bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-green-700 transition-colors disabled:bg-gray-400"
                            >
                                {isLoading ? <Spinner small={true}/> : <Icon name="PackageCheck" size={18} />}
                                {isLoading ? 'Procesando...' : 'Confirmar Recepción'}
                            </button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function ResolveIncidentForm({ isOpen, onClose, shipment, userId }) {
            const [isLoading, setIsLoading] = useState(false);
            const [resolution, setResolution] = useState('');
            const [comments, setComments] = useState('');
            const [incidentFolios, setIncidentFolios] = useState({});
            const [solutionVerified, setSolutionVerified] = useState({});

            useEffect(() => {
                if (shipment?.items) {
                    const initialFolios = {};
                    const initialVerified = {};
                    shipment.items.forEach(item => {
                        if (item.status && item.status !== 'OK') {
                            initialFolios[item.id] = '';
                            initialVerified[item.id] = false;
                        }
                    });
                    setIncidentFolios(initialFolios);
                    setSolutionVerified(initialVerified);
                }
            }, [shipment]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);

                try {
                    const updateData = {
                        status: 'Incidencia Resuelta',
                        lastUpdated: Timestamp.now(),
                        resolutionType: resolution,
                        resolutionComments: comments,
                        resolvedAt: Timestamp.now(),
                        incidentFolios: incidentFolios,
                        solutionVerified: solutionVerified,
                        history: firebase.firestore.FieldValue.arrayUnion({
                            action: 'Incidencia Resuelta',
                            timestamp: Timestamp.now(),
                            userId: userId,
                            details: `Resolución: ${resolution}. ${comments}`,
                            incidentFolios: incidentFolios,
                            solutionVerified: solutionVerified
                        })
                    };

                    await db.collection('shipments').doc(shipment.id).update(updateData);
                    onClose();
                } catch (error) {
                    console.error('Error al resolver incidencia:', error);
                    alert('Error al resolver la incidencia');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <Modal
                    isOpen={isOpen}
                    onClose={onClose}
                    title={`Resolver Incidencia - ${shipment?.id}`}
                    size="lg"
                >
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Resolución</label>
                            <select
                                value={resolution}
                                onChange={(e) => setResolution(e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            >
                                <option value="">Seleccionar resolución</option>
                                <option value="Artículo Encontrado">Artículo Encontrado</option>
                                <option value="Reposición">Reposición</option>
                                <option value="Compensación Económica">Compensación Económica</option>
                                <option value="Descuento Aplicado">Descuento Aplicado</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        {shipment?.items && Object.keys(incidentFolios).length > 0 && (
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">Folios con Incidencia y Soluciones</label>
                                <div className="space-y-3">
                                    {shipment.items.filter(item => item.status && item.status !== 'OK').map(item => (
                                        <div key={item.id} className="border border-gray-200 rounded-lg p-4">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <p className="font-medium text-sm">{item.sku || `Artículo ${item.id}`}</p>
                                                    <p className="text-xs text-gray-600">{item.observaciones}</p>
                                                    <span className={`inline-block px-2 py-1 text-xs rounded-full mt-1 ${
                                                        item.status === 'Faltante' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'
                                                    }`}>
                                                        {item.status}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-medium text-gray-700 mb-1">Folio de Incidencia</label>
                                                    <input
                                                        type="text"
                                                        value={incidentFolios[item.id] || ''}
                                                        onChange={(e) => setIncidentFolios(prev => ({ ...prev, [item.id]: e.target.value }))}
                                                        className="w-full px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                        placeholder="Folio de seguimiento"
                                                        required
                                                    />
                                                </div>
                                                <div className="flex items-center">
                                                    <input
                                                        type="checkbox"
                                                        id={`verified-${item.id}`}
                                                        checked={solutionVerified[item.id] || false}
                                                        onChange={(e) => setSolutionVerified(prev => ({ ...prev, [item.id]: e.target.checked }))}
                                                        className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                                                    />
                                                    <label htmlFor={`verified-${item.id}`} className="ml-2 block text-xs text-gray-700">
                                                        Solución verificada
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Comentarios de Resolución</label>
                            <textarea
                                value={comments}
                                onChange={(e) => setComments(e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                rows="4"
                                placeholder="Describe los detalles de la resolución..."
                                required
                            />
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button
                                type="button"
                                onClick={onClose}
                                className="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors"
                            >
                                Cancelar
                            </button>
                            <button
                                type="submit"
                                disabled={isLoading}
                                className="flex items-center gap-2 bg-orange-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-orange-700 transition-colors disabled:bg-gray-400"
                            >
                                {isLoading ? <Spinner small={true}/> : <Icon name="CheckCircle" size={18} />}
                                {isLoading ? 'Resolviendo...' : 'Resolver Incidencia'}
                            </button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function CloseCycleForm({ isOpen, onClose, shipment, userId, currentBranchId }) {
            const [isLoading, setIsLoading] = useState(false);
            const [formData, setFormData] = useState({
                closureType: '',
                // Dual closure fields for traspasos/remates
                folioSalidaOrigen: shipment?.folioSalidaOrigen || '',
                numeroDotacionDestino: shipment?.numeroDotacionDestino || '',
                // Venta a Colaborador fields
                saleSubType: '', // 'venta_mostrador' or 'compra_apartado'
                employeeId: '',
                employeeName: '',
                layawayNumber: '',
                numeroVenta: '',
                finalPrice: '',
                commission: '',
                // General fields
                destinationBranch: '',
                transferReason: '',
                auctionDetails: '',
                auctionDate: '',
                notes: ''
            });

            const [branches] = useState([
                { id: 'sucursal-principal', name: 'Sucursal Principal', type: 'Normal' },
                { id: 'sucursal-toluca', name: 'Sucursal Toluca', type: 'Normal' },
                { id: 'sucursal-remate-1', name: 'Sucursal de Remate Norte', type: 'Remate' },
                { id: 'sucursal-remate-2', name: 'Sucursal de Remate Sur', type: 'Remate' }
            ]);

            const closureTypes = [
                { value: 'traspaso', label: 'Traspaso entre Sucursales' },
                { value: 'venta_colaborador', label: 'Venta a Colaborador' },
                { value: 'remate', label: 'Envío a Sucursal de Remate' }
            ];

            const saleSubTypes = [
                { value: 'venta_mostrador', label: 'Venta de Mostrador (Liquidación Inmediata)' },
                { value: 'compra_apartado', label: 'Compra por Apartado' }
            ];

            // Check if dual closure is complete for traspasos/remates
            const isDualClosureComplete = (type) => {
                return type === 'traspaso' || type === 'remate' ? 
                    formData.folioSalidaOrigen && formData.numeroDotacionDestino : false;
            };

            // Auto-trigger closure when dual closure conditions are met
            useEffect(() => {
                if ((formData.closureType === 'traspaso' || formData.closureType === 'remate') && 
                    isDualClosureComplete(formData.closureType)) {
                    // Auto-close when both fields are filled
                    handleAutomaticClosure();
                }
            }, [formData.folioSalidaOrigen, formData.numeroDotacionDestino, formData.closureType]);

            const handleAutomaticClosure = async () => {
                if (isLoading) return;
                
                setIsLoading(true);
                try {
                    const updateData = {
                        status: 'Cerrado',
                        lastUpdated: Timestamp.now(),
                        fechaCierre: Timestamp.now(),
                        folioSalidaOrigen: formData.folioSalidaOrigen,
                        numeroDotacionDestino: formData.numeroDotacionDestino,
                        closureData: formData,
                        history: firebase.firestore.FieldValue.arrayUnion({
                            action: 'Cierre de Ciclo',
                            timestamp: Timestamp.now(),
                            userId: userId,
                            details: `Ciclo cerrado. Folio Origen: ${formData.folioSalidaOrigen}, Dotación Destino: ${formData.numeroDotacionDestino}`
                        })
                    };

                    await db.collection('shipments').doc(shipment.id).update(updateData);
                    alert('Ciclo cerrado automáticamente al completar ambos datos requeridos');
                    onClose();
                } catch (error) {
                    console.error('Error en cierre automático:', error);
                    alert('Error en el cierre automático del ciclo');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);

                try {
                    let updateData = {
                        lastUpdated: Timestamp.now(),
                        closureData: formData
                    };

                    let historyEntry = {
                        timestamp: Timestamp.now(),
                        userId: userId
                    };

                    // Handle different closure types
                    if (formData.closureType === 'venta_colaborador') {
                        if (formData.saleSubType === 'venta_mostrador') {
                            // Immediate closure for Venta de Mostrador
                            updateData.status = 'Cerrado (Venta)';
                            updateData.fechaLiquidacion = Timestamp.now();
                            updateData.numeroVenta = formData.numeroVenta;
                            historyEntry.action = 'Cierre de Venta';
                            historyEntry.details = `Venta cerrada con folio/ticket: ${formData.numeroVenta}`;
                        } else if (formData.saleSubType === 'compra_apartado') {
                            if (formData.numeroVenta) {
                                // Final liquidation for Compra por Apartado
                                updateData.status = 'Cerrado (Venta)';
                                updateData.fechaLiquidacion = Timestamp.now();
                                updateData.numeroVenta = formData.numeroVenta;
                                historyEntry.action = 'Liquidación y Cierre de Venta por Apartado';
                                historyEntry.details = `Apartado liquidado. Venta final cerrada con folio/ticket: ${formData.numeroVenta}`;
                            } else {
                                // Set to pending liquidation
                                updateData.status = 'Pendiente de Liquidación';
                                historyEntry.action = 'Apartado Registrado';
                                historyEntry.details = `Apartado registrado para colaborador: ${formData.employeeName}`;
                            }
                        }
                        
                        // Validate layaway number if provided
                        if (formData.layawayNumber && shipment.layawayFolio && 
                            shipment.layawayFolio !== formData.layawayNumber) {
                            alert('El número de apartado no coincide con el registrado originalmente');
                            setIsLoading(false);
                            return;
                        }
                        
                        updateData.employeeData = {
                            employeeId: formData.employeeId,
                            employeeName: formData.employeeName,
                            finalPrice: formData.finalPrice,
                            commission: formData.commission
                        };
                    }

                    updateData.history = firebase.firestore.FieldValue.arrayUnion(historyEntry);

                    await db.collection('shipments').doc(shipment.id).update(updateData);
                    onClose();
                } catch (error) {
                    console.error('Error al cerrar ciclo:', error);
                    alert('Error al cerrar el ciclo');
                } finally {
                    setIsLoading(false);
                }
            };

            const isOriginBranch = shipment?.originBranchId === currentBranchId;
            const isDestinationBranch = shipment?.destinationBranchId === currentBranchId;

            return (
                <Modal
                    isOpen={isOpen}
                    onClose={onClose}
                    title={`Cerrar Ciclo - ${shipment?.id}`}
                    size="lg"
                >
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                Tipo de Cierre *
                            </label>
                            <select
                                value={formData.closureType}
                                onChange={(e) => setFormData(prev => ({ ...prev, closureType: e.target.value }))}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            >
                                <option value="">Seleccionar tipo de cierre</option>
                                {closureTypes.map(type => (
                                    <option key={type.value} value={type.value}>{type.label}</option>
                                ))}
                            </select>
                        </div>

                        {/* Dual Closure for Traspasos and Remates */}
                        {(formData.closureType === 'traspaso' || formData.closureType === 'remate') && (
                            <>
                                <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                                    <div className="flex">
                                        <Icon name="AlertTriangle" size={20} className="text-yellow-600 mr-2 mt-0.5" />
                                        <div>
                                            <h4 className="text-sm font-medium text-yellow-900">Cierre Dual Requerido</h4>
                                            <p className="text-sm text-yellow-700 mt-1">
                                                Este tipo de cierre requiere información tanto de la sucursal origen como de la sucursal destino. 
                                                El ciclo se cerrará automáticamente cuando ambos datos estén completos.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                {isOriginBranch && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Folio de Salida del Sistema Origen *
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.folioSalidaOrigen}
                                            onChange={(e) => setFormData(prev => ({ ...prev, folioSalidaOrigen: e.target.value }))}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            placeholder="Folio generado por el sistema de la sucursal origen"
                                            required
                                        />
                                        <p className="text-xs text-gray-500 mt-1">
                                            Ingrese el folio de salida que generó su sistema local
                                        </p>
                                    </div>
                                )}

                                {isDestinationBranch && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Número de Dotación Destino *
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.numeroDotacionDestino}
                                            onChange={(e) => setFormData(prev => ({ ...prev, numeroDotacionDestino: e.target.value }))}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            placeholder="Número de dotación generado al recibir la mercancía"
                                            required
                                        />
                                        <p className="text-xs text-gray-500 mt-1">
                                            Ingrese el número de dotación que generó su sistema al recibir
                                        </p>
                                    </div>
                                )}

                                {/* Show current status of dual closure */}
                                <div className="grid grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                                    <div className="flex items-center">
                                        <Icon name={formData.folioSalidaOrigen ? "CheckCircle" : "Circle"} 
                                              size={16} 
                                              className={formData.folioSalidaOrigen ? "text-green-600" : "text-gray-400"} />
                                        <span className="ml-2 text-sm text-gray-700">Folio Origen</span>
                                    </div>
                                    <div className="flex items-center">
                                        <Icon name={formData.numeroDotacionDestino ? "CheckCircle" : "Circle"} 
                                              size={16} 
                                              className={formData.numeroDotacionDestino ? "text-green-600" : "text-gray-400"} />
                                        <span className="ml-2 text-sm text-gray-700">Dotación Destino</span>
                                    </div>
                                </div>

                                {formData.closureType === 'traspaso' && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Motivo del Traspaso
                                        </label>
                                        <textarea
                                            value={formData.transferReason}
                                            onChange={(e) => setFormData(prev => ({ ...prev, transferReason: e.target.value }))}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            rows="3"
                                            placeholder="Describir el motivo del traspaso..."
                                        />
                                    </div>
                                )}

                                {formData.closureType === 'remate' && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Fecha de Remate
                                            </label>
                                            <input
                                                type="date"
                                                value={formData.auctionDate}
                                                onChange={(e) => setFormData(prev => ({ ...prev, auctionDate: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Detalles del Remate
                                            </label>
                                            <textarea
                                                value={formData.auctionDetails}
                                                onChange={(e) => setFormData(prev => ({ ...prev, auctionDetails: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                rows="3"
                                                placeholder="Detalles adicionales del remate..."
                                            />
                                        </div>
                                    </>
                                )}
                            </>
                        )}

                        {/* Venta a Colaborador with Sub-types */}
                        {formData.closureType === 'venta_colaborador' && (
                            <>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Tipo de Venta *
                                    </label>
                                    <select
                                        value={formData.saleSubType}
                                        onChange={(e) => setFormData(prev => ({ ...prev, saleSubType: e.target.value }))}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        required
                                    >
                                        <option value="">Seleccionar tipo de venta</option>
                                        {saleSubTypes.map(type => (
                                            <option key={type.value} value={type.value}>{type.label}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* Employee Data - Always show for Venta a Colaborador */}
                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <h4 className="text-sm font-medium text-blue-900 mb-3">Datos del Colaborador</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                ID del Colaborador *
                                            </label>
                                            <input
                                                type="text"
                                                value={formData.employeeId}
                                                onChange={(e) => setFormData(prev => ({ ...prev, employeeId: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                required
                                                placeholder="ID del colaborador"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Nombre del Colaborador *
                                            </label>
                                            <input
                                                type="text"
                                                value={formData.employeeName}
                                                onChange={(e) => setFormData(prev => ({ ...prev, employeeName: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                required
                                                placeholder="Nombre completo"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Precio Final *
                                            </label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={formData.finalPrice}
                                                onChange={(e) => setFormData(prev => ({ ...prev, finalPrice: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                required
                                                placeholder="0.00"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Comisión
                                            </label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                value={formData.commission}
                                                onChange={(e) => setFormData(prev => ({ ...prev, commission: e.target.value }))}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"

                                            type="text"
                                            value={formData.layawayNumber}
                                            onChange={(e) => setFormData(prev => ({ ...prev, layawayNumber: e.target.value }))}

                                            required
                                            placeholder="Debe coincidir con el apartado original"
                                        />
                                        <p className="text-xs text-gray-500 mt-1">

                                        </p>
                                    </div>
                                )}

                                {(formData.saleSubType === 'venta_mostrador' || 
                                  (formData.saleSubType === 'compra_apartado' && formData.layawayNumber)) && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            {formData.saleSubType === 'venta_mostrador' ? 
                                                'Número de Venta/Ticket *' : 
                                                'Folio de Venta Final (para liquidación)'}
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.numeroVenta}
                                            onChange={(e) => setFormData(prev => ({ ...prev, numeroVenta: e.target.value }))}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            required={formData.saleSubType === 'venta_mostrador'}
                                            placeholder={formData.saleSubType === 'venta_mostrador' ? 
                                                'Folio del ticket de venta' : 
                                                'Dejar vacío si aún no se liquida'}
                                        />
                                    </div>
                                )}
                            </>
                        )}

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                Notas Adicionales
                            </label>
                            <textarea
                                value={formData.notes}
                                onChange={(e) => setFormData(prev => ({ ...prev, notes: e.target.value }))}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                rows="3"
                                placeholder="Comentarios adicionales sobre el cierre del ciclo..."

                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">

                                    <h4 className="text-sm font-medium text-blue-900">Información del Cierre</h4>

                                            'El cierre se realizará automáticamente cuando ambas sucursales completen sus datos.' :
                                            formData.saleSubType === 'venta_mostrador' ?
                                            'La venta se cerrará inmediatamente al confirmar.' :
                                            formData.saleSubType === 'compra_apartado' ?
                                            'El apartado quedará pendiente de liquidación hasta completar el pago.' :
                                            'Seleccione el tipo de cierre para ver más información.'

                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button
                                type="button"
                                onClick={onClose}
                                className="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors"
                            >
                                Cancelar
                            </button>
                            <button
                                type="submit"
                                disabled={isLoading || (formData.closureType === 'traspaso' || formData.closureType === 'remate') && isDualClosureComplete(formData.closureType)}

                            >
                                {isLoading ? <Spinner small={true}/> : <Icon name="Lock" size={18} />}
                                {isLoading ? 'Procesando...' : 
                                 isDualClosureComplete(formData.closureType) ? 'Cierre Automático Activado' :
                                 'Procesar Cierre'}
                            </button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function ShipmentSheet({ isOpen, onClose, shipment, branches }) {
            const [isExporting, setIsExporting] = useState(false);

            const handlePrint = () => {
                const printContent = document.getElementById('shipment-sheet-content');
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html>
                        <head>
                            <title>Hoja de Salida - ${shipment?.id}</title>
                            <style>
                                body { font-family: Arial, sans-serif; margin: 20px; }
                                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                                th { background-color: #f2f2f2; }
                                .header { text-align: center; margin-bottom: 30px; }
                                .signature-section { margin-top: 50px; display: flex; justify-content: space-between; }
                                .signature-box { width: 200px; text-align: center; }
                                .signature-line { border-top: 1px solid #000; margin-top: 50px; padding-top: 5px; }
                            </style>
                        </head>
                        <body>
                            ${printContent.innerHTML}
                        </body>
                    </html>
                `);
                printWindow.document.close();
                printWindow.print();
            };

            const handleExportExcel = async () => {
                setIsExporting(true);
                try {
                    const workbook = XLSX.utils.book_new();
                    
                    // Create shipment info sheet
                    const shipmentInfo = [
                        ['Folio', shipment?.id || ''],
                        ['Tipo', shipment?.type || ''],
                        ['Origen', shipment?.originBranchName || ''],
                        ['Destino', shipment?.destinationName || ''],
                        ['Estado', shipment?.status || ''],
                        ['Fecha Creación', shipment?.createdAt?.toDate ? shipment.createdAt.toDate().toLocaleDateString() : ''],
                        ['Notas', shipment?.notes || '']
                    ];
                    
                    const infoSheet = XLSX.utils.aoa_to_sheet(shipmentInfo);
                    XLSX.utils.book_append_sheet(workbook, infoSheet, 'Información');
                    
                    // Create items sheet
                    const items = Array.isArray(shipment?.items) ? shipment.items : [];
                    if (items.length > 0) {
                        const itemsData = [
                            ['SKU', 'Observaciones', 'Categoría', 'Marca', 'Modelo', 'Serie', 'Kilataje', 'Peso', 'Préstamo', 'Precio', 'Días PV']
                        ];
                        
                        items.forEach(item => {
                            itemsData.push([
                                item.sku || '',
                                item.observaciones || '',
                                item.category || '',
                                item.marca || '',
                                item.modelo || '',
                                item.serie || '',
                                item.kilataje || '',
                                item.peso || '',
                                item.prestamo || '',
                                item.precio || '',
                                item.diasPV || ''
                            ]);
                        });
                        
                        const itemsSheet = XLSX.utils.aoa_to_sheet(itemsData);
                        XLSX.utils.book_append_sheet(workbook, itemsSheet, 'Artículos');
                    }
                    
                    XLSX.writeFile(workbook, `Salida_${shipment?.id || 'export'}.xlsx`);
                } catch (error) {
                    console.error('Error al exportar Excel:', error);
                    alert('Error al exportar a Excel');
                } finally {
                    setIsExporting(false);
                }
            };

            const originBranch = branches?.find(b => b.id === shipment?.originBranchId);
            const destinationBranch = branches?.find(b => b.id === shipment?.destinationBranchId);

            return (
                <Modal
                    isOpen={isOpen}
                    onClose={onClose}
                    title={`Hoja de Salida - ${shipment?.id}`}
                    size="full"
                >
                    <div className="space-y-6">
                        <div className="flex justify-end gap-3 mb-4">
                            <button
                                onClick={handlePrint}
                                className="flex items-center gap-2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors"
                            >
                                <Icon name="Printer" size={18} />
                                Imprimir
                            </button>
                            <button
                                onClick={handleExportExcel}
                                disabled={isExporting}
                                className="flex items-center gap-2 bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-green-700 transition-colors disabled:bg-gray-400"
                            >
                                {isExporting ? <Spinner small={true}/> : <Icon name="Download" size={18} />}
                                {isExporting ? 'Exportando...' : 'Exportar Excel'}
                            </button>
                        </div>

                        <div id="shipment-sheet-content" className="bg-white p-8 border border-gray-300 rounded-lg">
                            <div className="header text-center mb-8">
                                <h1 className="text-2xl font-bold text-gray-800 mb-2">HOJA DE SALIDA</h1>
                                <h2 className="text-xl font-semibold text-blue-600">Sistema de Trazabilidad</h2>
                            </div>

                            <div className="grid grid-cols-2 gap-8 mb-8">
                                <div>
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4">Información General</h3>
                                    <table className="w-full">
                                        <tbody>
                                            <tr>
                                                <td className="font-medium py-2">Folio:</td>
                                                <td className="py-2">{shipment?.id}</td>
                                            </tr>
                                            <tr>
                                                <td className="font-medium py-2">Tipo:</td>
                                                <td className="py-2">{shipment?.type || 'N/A'}</td>
                                            </tr>
                                            <tr>
                                                <td className="font-medium py-2">Estado:</td>
                                                <td className="py-2">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                                                        shipment?.status === 'En Tránsito' ? 'bg-blue-100 text-blue-800' :
                                                        shipment?.status === 'Recibido' ? 'bg-green-100 text-green-800' :
                                                        shipment?.status?.includes('Incidencia') ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }`}>
                                                        {shipment?.status}
                                                    </span>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td className="font-medium py-2">Fecha:</td>
                                                <td className="py-2">{shipment?.createdAt?.toDate ? shipment.createdAt.toDate().toLocaleDateString() : 'N/A'}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div>
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4">Sucursales</h3>
                                    <table className="w-full">
                                        <tbody>
                                            <tr>
                                                <td className="font-medium py-2">Origen:</td>
                                                <td className="py-2">{originBranch?.name} ({originBranch?.code})</td>
                                            </tr>
                                            <tr>
                                                <td className="font-medium py-2">Destino:</td>
                                                <td className="py-2">{destinationBranch?.name} ({destinationBranch?.code})</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {shipment?.notes && (
                                <div className="mb-8">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2">Notas</h3>
                                    <p className="text-gray-700 bg-gray-50 p-4 rounded-lg">{shipment.notes}</p>
                                </div>
                            )}

                            <div className="mb-8">
                                <h3 className="text-lg font-semibold text-gray-800 mb-4">Detalle de Artículos</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full border border-gray-300">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">#</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Observaciones</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Categoría</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Marca</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Modelo</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Serie</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Kilataje</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Peso (gr)</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Préstamo</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Precio</th>
                                                <th className="border border-gray-300 px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Días PV</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(shipment?.items && Array.isArray(shipment.items) && shipment.items.length > 0) ? 
                                                shipment.items.map((item, index) => (
                                                    <tr key={item.id || index}>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{index + 1}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm font-mono">{item.sku || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.observaciones || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.category || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.marca || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.modelo || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.serie || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.kilataje || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.peso || 'N/A'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">${item.prestamo || '0'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">${item.precio || '0'}</td>
                                                        <td className="border border-gray-300 px-3 py-2 text-sm">{item.diasPV || 'N/A'}</td>
                                                    </tr>
                                                )) : (
                                                <tr>
                                                    <td colSpan="12" className="border border-gray-300 px-3 py-4 text-sm text-gray-500 text-center">
                                                        No hay artículos registrados
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="signature-section mt-16">
                                <div className="signature-box">
                                    <div className="signature-line">
                                        <p className="text-sm font-medium">Entrega</p>
                                        <p className="text-xs text-gray-600">Nombre y Firma</p>
                                    </div>
                                </div>
                                <div className="signature-box">
                                    <div className="signature-line">
                                        <p className="text-sm font-medium">Recibe</p>
                                        <p className="text-xs text-gray-600">Nombre y Firma</p>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8 text-xs text-gray-500 text-center">
                                <p>Este documento es generado automáticamente por el Sistema de Trazabilidad</p>
                                <p>Fecha de generación: {new Date().toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        }

        function ShipmentForm({ isOpen, onClose, branches, currentBranchId, userId }) {
            const [isLoading, setIsLoading] = useState(false);
            const [employeeName, setEmployeeName] = useState('');
            const [saleType, setSaleType] = useState('Venta de Mostrador');
            const [saleFolio, setSaleFolio] = useState('');
            const [layawayFolio, setLayawayFolio] = useState('');
            const [formData, setFormData] = useState({
                type: 'Traspaso entre Sucursales',
                destinationBranchId: '',
                notes: '',
                items: []
            });

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (formData.items.length === 0) {
                    alert('Debe agregar al menos un artículo');
                    return;
                }
                
                setIsLoading(true);
                
                try {
                    const originBranch = branches?.find(b => b.id === currentBranchId);
                    const destinationBranch = branches?.find(b => b.id === formData.destinationBranchId);
                    const folio = await generateNewFolio(currentBranchId, originBranch?.code || 'UNKNOWN');
                    
                    let destinationName = destinationBranch?.name || 'Desconocida';
                    let shipmentStatus = 'En Tránsito';
                    
                    if (formData.type === 'Venta a Colaborador') {
                        destinationName = employeeName;
                        if (saleType === 'Venta de Mostrador') {
                            shipmentStatus = 'Cerrado (Venta)';
                        } else {
                            shipmentStatus = 'Pendiente de Liquidación';
                        }
                    }

                    const shipmentData = {
                        type: formData.type,
                        originBranchId: currentBranchId,
                        originBranchName: originBranch?.name || 'Desconocida',
                        destinationBranchId: formData.destinationBranchId,
                        destinationName,
                        items: formData.items,
                        notes: formData.notes,
                        status: shipmentStatus,
                        createdAt: Timestamp.now(),
                        lastUpdated: Timestamp.now(),
                        createdBy: userId,
                        history: [{
                            action: 'Creado',
                            timestamp: Timestamp.now(),
                            userId: userId,
                            details: `Folio ${folio} creado con ${formData.items.length} artículos`
                        }]
                    };

                    if (formData.type === 'Venta a Colaborador') {
                        shipmentData.employeeName = employeeName;
                        shipmentData.saleType = saleType;
                        if (saleType === 'Venta de Mostrador') {
                            shipmentData.saleFolio = saleFolio;
                        } else {
                            shipmentData.layawayFolio = layawayFolio;
                        }
                    }
                    
                    await db.collection('shipments').doc(folio).set(shipmentData);
                    handleCloseModal();
                } catch (error) {
                    console.error('Error al crear salida:', error);
                    alert('Error al crear la salida');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCloseModal = () => {
                setFormData({
                    type: 'Traspaso entre Sucursales',
                    destinationBranchId: '',
                    notes: '',
                    items: []
                });
                setEmployeeName('');
                setSaleType('Venta de Mostrador');
                setSaleFolio('');
                setLayawayFolio('');
                onClose();
            };

            const handleAddItem = () => {
                const newItem = {
                    id: Date.now(),
                    sku: '',
                    observaciones: '',
                    marca: '',
                    modelo: '',
                    serie: '',
                    category: 'Metal',
                    kilataje: '',
                    peso: '',
                    prestamo: '',
                    precio: '',
                    diasPV: ''
                };
                setFormData(prev => ({
                    ...prev,
                    items: [...prev.items, newItem]
                }));
            };

            const handleRemoveItem = (index) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.filter((_, i) => i !== index)
                }));
            };

            const handleItemChange = (index, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => 
                        i === index ? { ...item, [field]: value } : item
                    )
                }));
            };

            return (
                <Modal
                    isOpen={isOpen}
                    onClose={handleCloseModal}
                    title="Nueva Salida"
                    size="xl"
                >
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Salida</label>
                                <select
                                    value={formData.type}
                                    onChange={(e) => setFormData({...formData, type: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    required
                                >
                                    <option value="Traspaso entre Sucursales">Traspaso entre Sucursales</option>
                                    <option value="Envío a Sucursal de Remate">Envío a Sucursal de Remate</option>
                                    <option value="Venta a Colaborador">Venta a Colaborador</option>
                                </select>
                            </div>
                            {formData.type !== 'Venta a Colaborador' && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Sucursal de Destino</label>
                                    <select
                                        value={formData.destinationBranchId}
                                        onChange={(e) => setFormData({...formData, destinationBranchId: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        required
                                    >
                                        <option value="">Seleccionar destino</option>
                                        {(() => {
                                            const otherBranches = branches?.filter(b => b.id !== currentBranchId && b.isActive !== false) || [];
                                            if (formData.type === 'Envío a Sucursal de Remate') {
                                                return otherBranches.filter(b => b.type === 'Remate');
                                            }
                                            return otherBranches;
                                        })().map(branch => (
                                            <option key={branch.id} value={branch.id}>{branch.name}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            {formData.type === 'Venta a Colaborador' && (
                                <>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Nombre del Empleado</label>
                                        <input 
                                            required 
                                            value={employeeName} 
                                            onChange={(e) => setEmployeeName(e.target.value)} 
                                            type="text" 
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Método de Pago</label>
                                        <select 
                                            value={saleType} 
                                            onChange={(e) => setSaleType(e.target.value)} 
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            <option>Venta de Mostrador</option>
                                            <option>Compra por Apartado</option>
                                        </select>
                                    </div>
                                    {saleType === 'Venta de Mostrador' && (
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Número de Venta / Folio Ticket</label>
                                            <input 
                                                required 
                                                value={saleFolio} 
                                                onChange={(e) => setSaleFolio(e.target.value)} 
                                                type="text" 
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                            />
                                        </div>
                                    )}
                                    {saleType === 'Compra por Apartado' && (
                                        <div>
