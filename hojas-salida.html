        // 5. Dashboard de Monitoreo de Cierres
        function ClosureMonitoringDashboard({ userPermissions, currentBranchId }) {
            const [pendingClosures, setPendingClosures] = useState([]);
            const [closureStats, setClosureStats] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [selectedTimeFilter, setSelectedTimeFilter] = useState('7d');

            useEffect(() => {
                if (!userPermissions?.isAdmin) return;
                
                const loadClosureData = async () => {
                    try {
                        setIsLoading(true);
                        
                        // Cargar cierres pendientes
                        const pendingQuery = db.collection('shipments')
                            .where('status', 'in', ['En Tránsito', 'Pendiente de Liquidación'])
                            .orderBy('createdAt', 'desc')
                            .limit(50);
                        
                        const pendingSnapshot = await pendingQuery.get();
                        const pending = pendingSnapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        
                        setPendingClosures(pending);
                        
                        // Calcular estadísticas
                        const now = new Date();
                        const timeFilters = {
                            '7d': 7 * 24 * 60 * 60 * 1000,
                            '30d': 30 * 24 * 60 * 60 * 1000,
                            '90d': 90 * 24 * 60 * 60 * 1000
                        };
                        
                        const filterTime = timeFilters[selectedTimeFilter];
                        const cutoffDate = new Date(now.getTime() - filterTime);
                        
                        const urgentClosures = pending.filter(p => {
                            const createdAt = p.createdAt?.toDate() || new Date();
                            return (now - createdAt) > (48 * 60 * 60 * 1000); // Más de 48 horas
                        });
                        
                        const avgDays = pending.length > 0 ? 
                            pending.reduce((sum, p) => {
                                const createdAt = p.createdAt?.toDate() || new Date();
                                const days = (now - createdAt) / (24 * 60 * 60 * 1000);
                                return sum + days;
                            }, 0) / pending.length : 0;
                        
                        setClosureStats({
                            totalPending: pending.length,
                            urgent: urgentClosures.length,
                            avgDays: Math.round(avgDays * 10) / 10,
                            alerts: urgentClosures.length
                        });
                        
                    } catch (error) {
                        console.error('Error cargando datos de monitoreo:', error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                
                loadClosureData();
                
                // Actualizar cada 30 segundos
                const interval = setInterval(loadClosureData, 30000);
                return () => clearInterval(interval);
                
            }, [userPermissions, selectedTimeFilter]);

            const sendManualNotification = async (shipmentId, branchId) => {
                try {
                    await NotificationSystem.createPendingClosureNotification(
                        shipmentId,
                        branchId,
                        'datos de cierre pendientes'
                    );
                    alert('✅ Notificación enviada exitosamente');
                } catch (error) {
                    console.error('Error enviando notificación:', error);
                    alert('❌ Error enviando notificación');
                }
            };

            if (!userPermissions?.isAdmin) {
                return null;
            }

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-gray-900">Dashboard de Monitoreo de Cierres</h2>
                        <select
                            value={selectedTimeFilter}
                            onChange={(e) => setSelectedTimeFilter(e.target.value)}
                            className="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="7d">Últimos 7 días</option>
                            <option value="30d">Últimos 30 días</option>
                            <option value="90d">Últimos 90 días</option>
                        </select>
                    </div>

                    {/* KPIs */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-lg shadow border">
                            <div className="flex items-center">
                                <Icon name="Clock" size={24} className="text-blue-600" />
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Cierres Pendientes</p>
                                    <p className="text-2xl font-bold text-gray-900">{closureStats.totalPending || 0}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-lg shadow border">
                            <div className="flex items-center">
                                <Icon name="AlertTriangle" size={24} className="text-red-600" />
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Urgentes (+48h)</p>
                                    <p className="text-2xl font-bold text-red-600">{closureStats.urgent || 0}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-lg shadow border">
                            <div className="flex items-center">
                                <Icon name="Calendar" size={24} className="text-green-600" />
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Promedio Días</p>
                                    <p className="text-2xl font-bold text-gray-900">{closureStats.avgDays || 0}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-lg shadow border">
                            <div className="flex items-center">
                                <Icon name="Bell" size={24} className="text-orange-600" />
                                <div className="ml-4">
                                    <p className="text-sm font-medium text-gray-600">Alertas Activas</p>
                                    <p className="text-2xl font-bold text-orange-600">{closureStats.alerts || 0}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Lista de Cierres Pendientes */}
                    <div className="bg-white rounded-lg shadow border">
                        <div className="px-6 py-4 border-b border-gray-200">
                            <h3 className="text-lg font-medium text-gray-900">Cierres Pendientes</h3>
                        </div>
                        
                        {isLoading ? (
                            <div className="p-6 text-center">
                                <Spinner />
                                <p className="mt-2 text-gray-600">Cargando datos...</p>
                            </div>
                        ) : pendingClosures.length === 0 ? (
                            <div className="p-6 text-center text-gray-500">
                                <Icon name="CheckCircle" size={48} className="mx-auto text-green-500 mb-4" />
                                <p>¡Excelente! No hay cierres pendientes</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Envío</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Días Pendiente</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {pendingClosures.map((closure) => {
                                            const createdAt = closure.createdAt?.toDate() || new Date();
                                            const daysPending = Math.floor((new Date() - createdAt) / (24 * 60 * 60 * 1000));
                                            const isUrgent = daysPending > 2;
                                            
                                            return (
                                                <tr key={closure.id} className={isUrgent ? 'bg-red-50' : ''}>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                                        {closure.id}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <span className={`inline-flex px-2 py-1 text-xs font-semibold rounded-full ${
                                                            closure.status === 'En Tránsito' ? 'bg-yellow-100 text-yellow-800' :
                                                            closure.status === 'Pendiente de Liquidación' ? 'bg-orange-100 text-orange-800' :
                                                            'bg-gray-100 text-gray-800'
                                                        }`}>
                                                            {closure.status}
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                                        <span className={isUrgent ? 'text-red-600 font-semibold' : ''}>
                                                            {daysPending} días
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        {closure.closureData?.closureType || 'No especificado'}
                                                    </td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                        <button
                                                            onClick={() => sendManualNotification(closure.id, closure.originBranchId)}
                                                            className="text-blue-600 hover:text-blue-900 mr-3"
                                                        >
                                                            Notificar Origen
                                                        </button>
                                                        <button
                                                            onClick={() => sendManualNotification(closure.id, closure.destinationBranchId)}
                                                            className="text-green-600 hover:text-green-900"
                                                        >
                                                            Notificar Destino
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [activeView, setActiveView] = useState('dashboard');
            const [branches, setBranches] = useState(null);
            const [currentBranchId, setCurrentBranchId] = useState(null);
            const [userId, setUserId] = useState(null);
            const [userPermissions, setUserPermissions] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [allShipments, setAllShipments] = useState([]);
            const [showLogin, setShowLogin] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (usr) => {
                    try {
                        if (!usr) {
                            setUser(null);
                            setUserId(null);
                            setUserPermissions(null);
                            setBranches(null);
                            setCurrentBranchId(null);
                            setShowLogin(true);
                            return;
                        }

                        setShowLogin(false);
                        setUser(usr);
                        setUserId(usr.uid);

                        // Load branches (bootstrap demo if empty)
                        const branchesSnapshot = await db.collection('branches').get();
                        let branchesData = branchesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (branchesData.length === 0) {
                            const demoBranches = [
                                { name: 'Sucursal Centro', code: 'CENTRO', type: 'Normal', isActive: true, address: 'Centro de la Ciudad' },
                                { name: 'Sucursal Norte', code: 'NORTE', type: 'Normal', isActive: true, address: 'Zona Norte' },
                                { name: 'Sucursal Remate', code: 'REMATE', type: 'Remate', isActive: true, address: 'Zona de Remates' }
                            ];
                            for (const b of demoBranches) {
                                await db.collection('branches').add(b);
                            }
                            const newSnapshot = await db.collection('branches').get();
                            branchesData = newSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        }
                        setBranches(branchesData);


                        // Load or create user permissions
                        const permDoc = await db.collection('user_permissions').doc(usr.uid).get();
                        if (permDoc.exists) {
                            const perms = permDoc.data();
                            setUserPermissions(perms);
                            if (perms.branchId) {
                                setCurrentBranchId(perms.branchId);
                            } else if (branchesData.length > 0) {
                                setCurrentBranchId(branchesData[0].id);
                            }
                        } else {
                            const defaultPermissions = {
                                email: usr.email || '',
                                userName: usr.email || '',
                                branchId: branchesData[0]?.id || null,
                                canCreateShipment: false,
                                canConfirmReceipt: false,
                                canResolveIncidents: false,
                                canManageBranches: false,
                                canManageUsers: false,
                                isAdmin: false
                            };
                            await db.collection('user_permissions').doc(usr.uid).set(defaultPermissions);
                            setUserPermissions(defaultPermissions);
                            if (defaultPermissions.branchId) setCurrentBranchId(defaultPermissions.branchId);
                        }
                    } catch (err) {
                        console.error('Error handling auth state:', err);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!userId) return;
                
                const unsubscribe = db.collection('user_permissions').doc(userId).onSnapshot(doc => {
                    if (doc.exists) {
                        const permissions = doc.data();
                        setUserPermissions(permissions);
                        
                        // Auto-select user's assigned branch on login
                        if (permissions.branchId && permissions.branchId !== currentBranchId) {
                            setCurrentBranchId(permissions.branchId);
                        }
                    } else {
                        const defaultPermissions = {
                            email: '',
                            userName: '',
                            branchId: currentBranchId,
                            canCreateShipment: false,
                            canConfirmReceipt: false,
                            canResolveIncidents: false,
                            canManageBranches: false,
                            canManageUsers: false,
                            isAdmin: false
                        };
                        db.collection('user_permissions').doc(userId).set(defaultPermissions);
                        setUserPermissions(defaultPermissions);
                    }
                });
                
                return unsubscribe;
            }, [userId, currentBranchId]);

            useEffect(() => {
                if (!userPermissions) return;
                let unsubscribes = [];

                if (userPermissions.isAdmin) {
                    const unsub = db.collection('shipments').onSnapshot(snapshot => {
                        setAllShipments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                    unsubscribes.push(unsub);
                } else if (currentBranchId) {
                    let originDocs = [];
                    let destDocs = [];

                    const mergeAndSet = () => {
                        const map = new Map();
                        originDocs.forEach(d => map.set(d.id, d));
                        destDocs.forEach(d => map.set(d.id, d));
                        setAllShipments(Array.from(map.values()));
                    };

                    const unsub1 = db.collection('shipments')
                        .where('originBranchId', '==', currentBranchId)
                        .onSnapshot(snapshot => {
                            originDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            mergeAndSet();
                        });

                    const unsub2 = db.collection('shipments')
                        .where('destinationBranchId', '==', currentBranchId)
                        .onSnapshot(snapshot => {
                            destDocs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            mergeAndSet();
                        });

                    unsubscribes.push(unsub1, unsub2);
                }

                return () => {
                    unsubscribes.forEach(u => { try { u && u(); } catch (e) {} });
                };
            }, [userPermissions, currentBranchId]);

            useEffect(() => {
                if (!currentBranchId) return;

                const unsubscribe = db.collection('shipments')
                    .where('destinationBranchId', '==', currentBranchId)
                    .where('status', '==', 'En Tránsito')
                    .onSnapshot(snapshot => {
                        const pendingShipments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        const overdueShipments = pendingShipments.filter(shipment => {
                            const createdAt = shipment.createdAt?.toDate();
                            if (!createdAt) return false;
                            const daysDiff = (new Date() - createdAt) / (1000 * 60 * 60 * 24);
                            return daysDiff > 2;
                        });

                        setNotifications(overdueShipments.map(shipment => ({
                            id: shipment.id,
                            title: 'Envío Pendiente de Recepción',
                            message: `Salida ${shipment.id} lleva más de 2 días en tránsito`,
                            type: 'warning'
                        })));
                    });

                return unsubscribe;
            }, [currentBranchId]);

            const renderActiveView = () => {
                if (!branches || !currentBranchId || !userId || userPermissions === null) {
                    return (
                        <div className="flex items-center justify-center h-64">
                            <Spinner />
                        </div>
                    );
                }

                switch (activeView) {
                    case 'dashboard':
                        return <Dashboard shipments={allShipments} currentBranchId={currentBranchId} userPermissions={userPermissions} />;
                    case 'salidas':
                    case 'monitoreo':
                        return <ClosureMonitoringDashboard userPermissions={userPermissions} currentBranchId={currentBranchId} />;
                        return <ShipmentManagement branches={branches} currentBranchId={currentBranchId} userId={userId} userPermissions={userPermissions} />;
                    case 'usuarios':
                        if (userPermissions?.isAdmin || userPermissions?.canManageUsers) {
                            return <UserManagement branches={branches} />;
                        }
                        return <div className="p-4 text-sm text-red-600">No tienes permisos para ver Usuarios.</div>;
                    case 'sucursales':
                        if (userPermissions?.isAdmin || userPermissions?.canManageBranches) {
                            return <BranchManagement branches={branches} />;
                        }
                        return <div className="p-4 text-sm text-red-600">No tienes permisos para ver Sucursales.</div>;
                    case 'reportes':
                        return <Reports shipments={allShipments} currentBranchId={currentBranchId} userPermissions={userPermissions} />;
                    default:
                        return <Dashboard shipments={allShipments} currentBranchId={currentBranchId} userPermissions={userPermissions} />;
                }
            };

            if (showLogin) {
                return <LoginView />;
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <nav className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <div className="flex-shrink-0 flex items-center">
                                        <Icon name="Package" size={32} className="text-blue-600" />
                                        <span className="ml-2 text-xl font-bold text-gray-900">Sistema de Trazabilidad</span>
                                    </div>
                                    <div className="hidden sm:ml-6 sm:flex sm:space-x-8">
                                        {[
                                            { id: 'dashboard', label: 'Dashboard', icon: 'BarChart3', show: true },
                                            { id: 'salidas', label: 'Salidas', icon: 'Package', show: true },
                                            { id: 'monitoreo', label: 'Monitoreo Cierres', icon: 'Activity', show: !!(userPermissions?.isAdmin) },
                                            { id: 'usuarios', label: 'Usuarios', icon: 'Users', show: !!(userPermissions?.isAdmin || userPermissions?.canManageUsers) },
                                            { id: 'sucursales', label: 'Sucursales', icon: 'Building', show: !!(userPermissions?.isAdmin || userPermissions?.canManageBranches) },
                                            { id: 'reportes', label: 'Reportes', icon: 'FileText', show: true }
                                        ].filter(i => i.show).map(item => (
                                            <button
                                                key={item.id}
                                                onClick={() => setActiveView(item.id)}
                                                className={`inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium ${
                                                    activeView === item.id
                                                        ? 'border-blue-500 text-blue-600'
                                                        : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                                }`}
                                            >
                                                <Icon name={item.icon} size={16} className="mr-2" />
                                                {item.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex flex-col items-end space-y-2">
                                    <div className="flex items-center space-x-4">
                                        <div className="flex items-center space-x-2 min-w-0">
                                            <Icon name="User" size={16} className="text-gray-400 flex-shrink-0" />
                                            <span className="text-sm text-gray-600 truncate">{userPermissions?.userName || 'Usuario'}</span>
                                            {userPermissions?.isAdmin && <span className="px-2 py-1 bg-red-100 text-red-800 text-xs font-semibold rounded-full whitespace-nowrap">Admin</span>}
                                        </div>
                                        {userId && (
                                            <div className="flex items-center space-x-2 bg-gray-50 px-3 py-1 rounded-lg min-w-0">
                                                <Icon name="Hash" size={14} className="text-gray-500 flex-shrink-0" />
                                                <span className="text-xs text-gray-600 font-mono truncate">{userId.substring(0, 8)}...</span>
                                                <button
                                                    onClick={() => {
                                                        navigator.clipboard.writeText(userId);
                                                        alert('ID de usuario copiado al portapapeles');
                                                    }}
                                                    className="text-blue-600 hover:text-blue-800 text-xs whitespace-nowrap"
                                                    title="Copiar ID completo"
                                                >
                                                    Copiar
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <div className="flex items-center space-x-2 min-w-0">
                                            <Icon name="Building" size={18} className="text-gray-400 flex-shrink-0" />
                                            {userPermissions?.isAdmin ? (
                                                <select
                                                    value={currentBranchId || ''}
                                                    onChange={(e) => setCurrentBranchId(e.target.value)}
                                                    className="text-sm text-gray-700 font-medium bg-transparent border-none focus:outline-none focus:ring-0 cursor-pointer truncate pr-6"
                                                    style={{ minWidth: '120px', backgroundImage: 'url("data:image/svg+xml,%3csvg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 20 20\'%3e%3cpath stroke=\'%236b7280\' stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'1.5\' d=\'M6 8l4 4 4-4\'/%3e%3c/svg%3e")', backgroundPosition: 'right 0.5rem center', backgroundRepeat: 'no-repeat', backgroundSize: '1.5em 1.5em' }}
                                                >
                                                    {branches?.filter(branch => branch.isActive).map(branch => (
                                                        <option key={branch.id} value={branch.id}>
                                                            {branch.name}
                                                        </option>
                                                    ))}
                                                </select>
                                            ) : (
                                                <span className="text-sm text-gray-700 font-medium truncate">
                                                    {branches?.find(b => b.id === currentBranchId)?.name || 'Cargando...'}
                                                </span>
                                            )}
                                        </div>
                                        <button onClick={() => auth.signOut()} className="text-sm text-gray-600 hover:text-gray-800 border px-3 py-1 rounded">
                                            Cerrar sesión
                                        </button>

                                        <NotificationBell notifications={notifications} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
                        <div className="px-4 py-6 sm:px-0">
                            {renderActiveView()}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
